[package]
name = "omd-media"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fixture-tests = ["omd-network/fixture-tests", "dep:reqwest"]

[[bin]]
name = "omd-media-probe"
path = "src/bin/omd-media-probe.rs"
required-features = ["fixture-tests"]

[dependencies]
reqwest = { workspace = true, optional = true }
omd-credentials = { path = "../omd-credentials" }
omd-files = { path = "../omd-files" }
omd-domain = { path = "../omd-domain" }
omd-network = { path = "../omd-network" }
omd-helper-broker = { path = "../omd-helper-broker" }
omd-isolation = { path = "../omd-isolation" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[dev-dependencies]
http = "1"
zeroize = "1"
chrono.workspace = true
